<!DOCTYPE html>
<html>
<head>
    <title>My first website</title>
    <link rel="stylesheet" href="stylesheet.css">

</head>
<body>

    <form  method="GET" action="successful.html">

        <div>
            <label for="fname">first name:</label>
            <input type="text" id="fname" name="fname" placeholder="soma" required>
        </div>

        <br>

        <div>
            <label for="lname">last name:</label>
            <input type="text" id="lname" name="lname" placeholder="Sekhar" required>
        </div>

        <br>

         <div>
            <label for="email">email:</label>
            <input type="email" id="email" name="email" placeholder="example123@gmail.com">
        </div>

        <br>
        <div>
            <label for="pass">password:</label>
            <input type="password" id="pass" name="pass" maxlength="12" required>
        </div>

        <br>

     

        <div>
            <label for="phone">phone number:</label>
            <input type="tel" id="phone" name="phone" placeholder="(123)-456-7890">
        </div>

        <br>

        <div>
            <label for="bdate">dob:</label>
            <input type="date" id="bdate" name="bdate">
        </div>

        <br>

        <div>
            <label for="quantity">adress:</label>
            <input type="number" id="quantity" name="quantity" min="0" max="99000" value="">
        </div>

        <br>

        <div>
            <label for="title">title:</label>

            <label for="Mr.">Mr.</label>
            <input type="radio" id="Mr." name="title" value="Mr.">

            <label for="Mrs.">Mrs.</label>
            <input type="radio" id="Mrs." name="title" value="Mrs.">

            <label for="PhD.">other</label>
            <input type="radio" id="PhD." name="title" value="PhD.">
        </div>

        <br>

        <div>
            <label for="payment">payment through:</label>
            <select id="payment" name="payment">
                <option value="visa">check</option>
                <option value="mastercard">cash </option>
                <option value="giftcard">google pay</option>
            </select>
        </div>

        <br>

        <div>
            <label for="subscribe">sekhar is the best:</label>
            <input type="checkbox" id="subscribe" name="subscribe">
        </div>

        <br>

        <div>
            <input type="reset">
        </div>

        <br>

        <div>
            <input type="submit">
        </div>

    </form>

</body>
</html>
