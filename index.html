<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Music Player</title>

    <style>
        /* =========================
           BASIC
        ========================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e1b4b, #111827);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        /* =========================
           MUSIC PLAYER
        ========================= */
        .player {
            width: 380px;
            padding: 30px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 25px;
            backdrop-filter: blur(15px);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4);
            text-align: center;
            animation: appear 1s ease;
        }

        /* =========================
           TITLE
        ========================= */
        .title {
            font-size: 24px;
            margin-bottom: 25px;
        }

        .title span {
            color: #a78bfa;
        }

        /* =========================
           ALBUM ART
        ========================= */
        .album {
            width: 210px;
            height: 210px;
            margin: auto;
            border-radius: 50%;
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 75px;
            box-shadow: 0 0 40px rgba(139, 92, 246, 0.5);
            animation: rotate 8s linear infinite;
            animation-play-state: paused;
        }

        .album.playing {
            animation-play-state: running;
        }

        /* =========================
           SONG DETAILS
        ========================= */
        .song-name {
            font-size: 22px;
            margin-top: 30px;
            word-break: break-word;
        }

        .artist {
            color: #cbd5e1;
            margin-top: 5px;
        }

        /* =========================
           PROGRESS BAR
        ========================= */
        .progress-area {
            margin-top: 25px;
        }

        .progress {
            width: 100%;
            height: 6px;
            appearance: none;
            background: #475569;
            border-radius: 10px;
            cursor: pointer;
        }

        .progress::-webkit-slider-thumb {
            appearance: none;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: #a78bfa;
            cursor: pointer;
        }

        .time {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            color: #94a3b8;
            font-size: 13px;
        }

        /* =========================
           CONTROLS
        ========================= */
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
            margin-top: 25px;
        }

        .control {
            width: 45px;
            height: 45px;
            border: none;
            border-radius: 50%;
            background: #334155;
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
        }

        .control:hover {
            transform: scale(1.15);
            background: #8b5cf6;
        }

        .play {
            width: 65px;
            height: 65px;
            font-size: 25px;
            background: #8b5cf6;
        }

        .play:hover {
            background: #a78bfa;
            box-shadow: 0 0 25px rgba(167, 139, 250, 0.6);
        }

        /* =========================
           VOLUME
        ========================= */
        .volume {
            margin-top: 25px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .volume span {
            font-size: 18px;
        }

        .volume input {
            width: 100%;
            appearance: none;
            height: 5px;
            background: #475569;
            border-radius: 10px;
        }

        .volume input::-webkit-slider-thumb {
            appearance: none;
            width: 13px;
            height: 13px;
            border-radius: 50%;
            background: #ec4899;
        }

        /* =========================
           FILE INPUT BUTTON
        ========================= */
        .upload-btn {
            display: block;
            width: 100%;
            margin-top: 25px;
            padding: 10px;
            background: rgba(167, 139, 250, 0.2);
            border: 1px dashed #a78bfa;
            border-radius: 12px;
            color: #c4b5fd;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
        }

        .upload-btn:hover {
            background: rgba(167, 139, 250, 0.35);
            color: white;
        }

        #fileInput {
            display: none;
        }

        /* =========================
           PLAYLIST
        ========================= */
        .playlist {
            margin-top: 20px;
            text-align: left;
            max-height: 180px;
            overflow-y: auto;
        }

        .playlist h3 {
            margin-bottom: 12px;
            color: #c4b5fd;
        }

        .song {
            padding: 10px 12px;
            margin-bottom: 8px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.06);
            cursor: pointer;
            transition: 0.3s;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .song:hover {
            background: rgba(167, 139, 250, 0.2);
            transform: translateX(6px);
        }

        .song.active {
            background: rgba(167, 139, 250, 0.35);
            font-weight: bold;
            border-left: 4px solid #a78bfa;
        }

        /* =========================
           ANIMATIONS
        ========================= */
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* =========================
           RESPONSIVE
        ========================= */
        @media (max-width: 500px) {
            body { padding: 15px; }
            .player { width: 100%; padding: 25px 20px; }
            .album { width: 180px; height: 180px; font-size: 60px; }
            .controls { gap: 15px; }
        }
    </style>
</head>

<body>

    <audio id="audio"></audio>

    <div class="player">

        <div class="title">
            🎵 <span>My Music</span>
        </div>

        <div class="album" id="albumArt">🎧</div>

        <h2 class="song-name" id="songTitle">Song 1</h2>
        <p class="artist" id="artistName">Track 1</p>

        <div class="progress-area">
            <input type="range" class="progress" id="progress" min="0" max="100" value="0">
            <div class="time">
                <span id="currentTime">0:00</span>
                <span id="duration">0:00</span>
            </div>
        </div>

        <div class="controls">
            <button class="control" id="prevBtn">⏮</button>
            <button class="control play" id="playBtn">▶</button>
            <button class="control" id="nextBtn">⏭</button>
        </div>

        <div class="volume">
            <span>🔊</span>
            <input type="range" id="volumeSlider" min="0" max="100" value="70">
        </div>

        <!-- FILE INPUT FOR EXTRA SONGS -->
        <label for="fileInput" class="upload-btn">
            📂 Add More Songs From Device
        </label>
        <input type="file" id="fileInput" accept="audio/*" multiple>

        <div class="playlist">
            <h3>Playlist</h3>
            <div id="playlistContainer"></div>
        </div>

    </div>

    <script>
        // Configured directly with song1.mp3, song2.mp3, and song3.mp3
        let playlist = [
            {
                title: "Song 1",
                artist: "Track 1",
                src: "song1.mp3"
            },
            {
                title: "Song 2",
                artist: "Track 2",
                src: "song2.mp3"
            },
            {
                title: "Song 3",
                artist: "Track 3",
                src: "song3.mp3"
            }
        ];

        let currentTrack = 0;
        let isPlaying = false;

        const audio = document.getElementById("audio");
        const playBtn = document.getElementById("playBtn");
        const prevBtn = document.getElementById("prevBtn");
        const nextBtn = document.getElementById("nextBtn");
        const progress = document.getElementById("progress");
        const currentTimeEl = document.getElementById("currentTime");
        const durationEl = document.getElementById("duration");
        const volumeSlider = document.getElementById("volumeSlider");
        const songTitle = document.getElementById("songTitle");
        const artistName = document.getElementById("artistName");
        const albumArt = document.getElementById("albumArt");
        const fileInput = document.getElementById("fileInput");
        const playlistContainer = document.getElementById("playlistContainer");

        // Load the initial playlist on page setup
        window.addEventListener("DOMContentLoaded", () => {
            renderPlaylist();
            loadSong(0);
        });

        // Handle additional file imports dynamically
        fileInput.addEventListener("change", (e) => {
            const files = Array.from(e.target.files);

            files.forEach((file) => {
                const songUrl = URL.createObjectURL(file);
                const cleanName = file.name.replace(/\.[^/.]+$/, "");

                playlist.push({
                    title: cleanName,
                    artist: "Local Track",
                    src: songUrl
                });
            });

            renderPlaylist();
        });

        function renderPlaylist() {
            playlistContainer.innerHTML = "";
            playlist.forEach((song, idx) => {
                const songDiv = document.createElement("div");
                songDiv.className = `song ${idx === currentTrack ? 'active' : ''}`;
                songDiv.innerText = `🎵 ${song.title}`;
                songDiv.addEventListener("click", () => {
                    loadSong(idx);
                    audio.play();
                });
                playlistContainer.appendChild(songDiv);
            });
        }

        function loadSong(index) {
            if (playlist.length === 0) return;
            currentTrack = index;
            audio.src = playlist[index].src;
            songTitle.innerText = playlist[index].title;
            artistName.innerText = playlist[index].artist;

            renderPlaylist();
        }

        function togglePlay() {
            if (playlist.length === 0) return;
            if (isPlaying) {
                audio.pause();
            } else {
                audio.play();
            }
        }

        playBtn.addEventListener("click", togglePlay);

        audio.addEventListener("play", () => {
            isPlaying = true;
            playBtn.innerText = "⏸";
            albumArt.classList.add("playing");
        });

        audio.addEventListener("pause", () => {
            isPlaying = false;
            playBtn.innerText = "▶";
            albumArt.classList.remove("playing");
        });

        audio.addEventListener("timeupdate", () => {
            if (audio.duration) {
                progress.value = (audio.currentTime / audio.duration) * 100;
                currentTimeEl.innerText = formatTime(audio.currentTime);
                durationEl.innerText = formatTime(audio.duration);
            }
        });

        progress.addEventListener("input", () => {
            if (audio.duration) {
                audio.currentTime = (progress.value / 100) * audio.duration;
            }
        });

        volumeSlider.addEventListener("input", (e) => {
            audio.volume = e.target.value / 100;
        });

        prevBtn.addEventListener("click", () => {
            if (playlist.length === 0) return;
            currentTrack = (currentTrack - 1 + playlist.length) % playlist.length;
            loadSong(currentTrack);
            audio.play();
        });

        nextBtn.addEventListener("click", () => {
            if (playlist.length === 0) return;
            currentTrack = (currentTrack + 1) % playlist.length;
            loadSong(currentTrack);
            audio.play();
        });

        audio.addEventListener("ended", () => {
            nextBtn.click();
        });

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? "0" : ""}${secs}`;
        }

        audio.volume = volumeSlider.value / 100;
    </script>

</body>
</html>
